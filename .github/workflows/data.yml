# Draait de Python-tests bij elke pull request die iets in data/ verandert.
# Het resultaat zie je onderaan de pull request: een groen vinkje of een rood kruisje.
name: Data (Python)

on:
  pull_request:
    paths:
      - "data/**"
      - ".github/workflows/data.yml"
  push:
    branches: [main]
    paths:
      - "data/**"
      - ".github/workflows/data.yml"

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: data/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
